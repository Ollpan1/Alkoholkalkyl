<title>Alkoholkalkyl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Design plan: minimalist alcohol tracker
     Color tokens: light bg, dark fg, muted secondary, accent blue
     Typography: system fonts, strong hierarchy
     Layout: vertical stack, form sections above, chart area below
  */

  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e5e5e5;
    --accent: #0066cc;
    --accent-light: #e6f2ff;
    --error: #d32f2f;
    --success: #388e3c;
    --input-bg: #f9f9f9;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a;
      --fg: #ffffff;
      --muted: #999999;
      --border: #333333;
      --accent: #4a9eff;
      --accent-light: #1a3a52;
      --input-bg: #262626;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1a1a1a;
    --fg: #ffffff;
    --muted: #999999;
    --border: #333333;
    --accent: #4a9eff;
    --accent-light: #1a3a52;
    --input-bg: #262626;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  * {
    box-sizing: border-box;
  }

  h1, h2 {
    margin: 0;
    font-weight: 600;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
  }

  h2 {
    font-size: 1.125rem;
    margin-bottom: 1rem;
  }

  /* Layout container */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding-top: 1rem;
  }

  /* Form sections */
  .form-section {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  /* Form grid */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  @media (min-width: 500px) {
    .form-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* Form groups */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  label {
    font-weight: 500;
    color: var(--fg);
    font-size: 0.95rem;
  }

  input, select {
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 1rem;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  /* Buttons */
  button {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 6px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 1rem;
    transition: background-color 0.2s, color 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-secondary {
    background: var(--border);
    color: var(--fg);
  }

  .btn-secondary:hover {
    opacity: 0.8;
  }

  .btn-danger {
    background: var(--error);
    color: white;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
  }

  .btn-danger:hover {
    opacity: 0.9;
  }

  /* Settings section */
  #settingsSection {
    margin-bottom: 2rem;
  }

  /* Drinks list */
  .drinks-list {
    margin-top: 1.5rem;
  }

  .drink-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .drink-info {
    flex: 1;
    min-width: 0;
  }

  .drink-time {
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .drink-details {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .drink-actions {
    display: flex;
    gap: 0.5rem;
  }

  /* Drink suggestions dropdown */
  #drinkSuggestions {
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .drink-suggestion {
    padding: 0.75rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .drink-suggestion:hover {
    background-color: var(--accent-light);
  }

  .drink-suggestion:last-child {
    border-bottom: none;
  }

  .suggestion-name {
    font-weight: 500;
    color: var(--fg);
  }

  .suggestion-details {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  /* Chart area */
  #chartSection {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  #chartContainer {
    width: 100%;
    min-height: 350px;
    margin-top: 1rem;
    position: relative;
  }

  canvas {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
  }

  /* Helpers */
  .text-muted {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .mt-1 {
    margin-top: 0.5rem;
  }

  .mt-2 {
    margin-top: 1rem;
  }

  @media (max-width: 499px) {
    .form-section {
      padding: 1rem;
    }

    h1 {
      font-size: 1.25rem;
    }

    button {
      width: 100%;
    }
  }
</style>

<div class="container">
  <h1>Alkoholkalkyl</h1>

  <!-- Settings Section -->
  <div id="settingsSection" class="form-section">
    <h2>Personliga inställningar</h2>

    <div class="form-grid">
      <div class="form-group">
        <label for="weight">Kroppsvikt (kg)</label>
        <input type="number" id="weight" min="30" max="200" step="0.1" placeholder="70">
      </div>

      <div class="form-group">
        <label for="gender">Kön</label>
        <select id="gender">
          <option value="male">Man</option>
          <option value="female">Kvinna</option>
        </select>
      </div>

      <div class="form-group">
        <label for="hunger">Hungringsnivå</label>
        <select id="hunger">
          <option value="hungry">Hungrig</option>
          <option value="full" selected>Mätt</option>
          <option value="blom">Edward Blom</option>
        </select>
      </div>
    </div>

    <button class="btn-secondary mt-2" onclick="clearDrinks()">Rensa historik</button>
  </div>

  <!-- Drink Registration Section -->
  <div class="form-section">
    <h2>Lägg till drink</h2>

    <div class="form-grid">
      <div class="form-group">
        <label for="drinkSearch">Sök drink</label>
        <input type="text" id="drinkSearch" placeholder="T.ex. Heineken, Bärlincrona...">
        <div id="drinkSuggestions" style="position: absolute; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-top: 0.25rem; max-height: 300px; overflow-y: auto; display: none; z-index: 100; width: 100%; min-width: 200px;"></div>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="volume">Volym (ml)</label>
        <input type="number" id="volume" min="10" max="500" step="10" placeholder="250">
      </div>

      <div class="form-group">
        <label for="alcoholContent">Alkoholhalt (%)</label>
        <input type="number" id="alcoholContent" min="0" max="100" step="0.1" placeholder="5">
      </div>

      <div class="form-group">
        <label for="drinkTime">Tidpunkt</label>
        <input type="time" id="drinkTime">
      </div>

      <div class="form-group">
        <label>&nbsp;</label>
        <button class="btn-primary" onclick="addDrink()">Lägg till drink</button>
      </div>
    </div>

    <!-- Drinks List -->
    <div class="drinks-list" id="drinksList"></div>
  </div>

  <!-- Chart Section -->
  <div id="chartSection">
    <h2>Promillekurva (nästa 8 timmar)</h2>
    <div id="chartContainer"></div>
  </div>

  <!-- APK Statistics Section -->
  <div id="apkSection" class="form-section">
    <h2>Kvällens APK</h2>
    <div style="display: flex; align-items: center; gap: 1rem; justify-content: center;">
      <div style="font-size: 2.5rem; font-weight: bold; color: var(--accent);" id="apkValue">-</div>
    </div>
  </div>

  <!-- Promilleplanerare Section -->
  <div class="form-section">
    <h2>Promilleplanerare</h2>

    <div class="form-grid">
      <div class="form-group">
        <label for="planStartTime">Börja dricka (tid)</label>
        <input type="time" id="planStartTime" placeholder="19:00">
      </div>

      <div class="form-group">
        <label for="planTargetTime">Nå målpromille (tid)</label>
        <input type="time" id="planTargetTime" placeholder="20:00">
      </div>

      <div class="form-group">
        <label for="planEndTime">Sluta dricka (tid)</label>
        <input type="time" id="planEndTime" placeholder="21:00">
      </div>

      <div class="form-group">
        <label for="planTargetPromille">Målpromille (‰)</label>
        <input type="number" id="planTargetPromille" min="0" max="3" step="0.1" placeholder="0.6">
      </div>

      <div class="form-group">
        <label for="planDrinkType">Drycktyp</label>
        <select id="planDrinkType" onchange="updateDrinkOptions()">
          <option value="ol">Öl</option>
          <option value="cider">Cider</option>
          <option value="vin">Vin</option>
          <option value="sprit">Sprit</option>
        </select>
      </div>

      <div class="form-group">
        <label for="planDrinkSize">Storlek & Styrka</label>
        <select id="planDrinkSize">
          <!-- Fylls dynamiskt baserat på drycktyp -->
        </select>
      </div>

      <div class="form-group">
        <label>&nbsp;</label>
        <button class="btn-primary" onclick="calculatePlan()">Beräkna plan</button>
      </div>
    </div>

    <!-- Resultat -->
    <div id="planResult" style="margin-top: 1.5rem; display: none;">
      <div style="background: var(--accent-light); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem;">
        <h3 style="margin: 0 0 1rem 0; color: var(--fg);">Din promillplan</h3>

        <div style="margin-bottom: 1.5rem;">
          <h4 style="margin: 0 0 0.5rem 0; color: var(--fg);">Uppbyggningsfas</h4>
          <p id="planBuildupText" style="margin: 0; color: var(--muted); font-size: 0.95rem;"></p>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <h4 style="margin: 0 0 0.5rem 0; color: var(--fg);">Underhållsfas</h4>
          <p id="planMaintenanceText" style="margin: 0; color: var(--muted); font-size: 0.95rem;"></p>
        </div>

        <div>
          <h4 style="margin: 0 0 0.5rem 0; color: var(--fg);">Schema</h4>
          <p id="planSchedule" style="margin: 0; color: var(--muted); font-size: 0.95rem; font-family: monospace;"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Constants
  const BETA = 0.15; // Elimination rate ‰/h
  const K_VALUES = {
    hungry: 3,
    full: 1.5,
    blom: 1
  };
  const REDUCTION_FACTOR = {
    male: 0.7,
    female: 0.6
  };

  // Initialize on load
  document.addEventListener('DOMContentLoaded', () => {
    loadDrinksDatabase();
    loadSettings();
    setDefaultDrinkTime();
    loadDrinks();
    updateChart();
    updateDrinkOptions(); // Initialisera promilleplanerare-dropdowns

    // Update chart when settings change
    document.getElementById('weight').addEventListener('change', () => {
      saveSettings();
      updateChart();
    });

    document.getElementById('gender').addEventListener('change', () => {
      saveSettings();
      updateChart();
    });

    document.getElementById('hunger').addEventListener('change', () => {
      saveSettings();
      updateChart();
    });

    // Setup drink search
    document.getElementById('drinkSearch').addEventListener('input', (e) => {
      searchDrinks(e.target.value);
      // Återställ knappens färg till blå om sökfältet är tomt
      if (!e.target.value) {
        const addButton = document.querySelector('button.btn-primary');
        addButton.style.backgroundColor = 'var(--accent)';
      }
    });

    // Close suggestions when clicking outside
    document.addEventListener('click', (e) => {
      if (e.target.id !== 'drinkSearch') {
        document.getElementById('drinkSuggestions').style.display = 'none';
      }
    });
  });

  // Set default drink time to now
  function setDefaultDrinkTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('drinkTime').value = `${hours}:${minutes}`;
  }

  // Load drinks database
  let drinksDatabase = [];
  async function loadDrinksDatabase() {
    try {
      const response = await fetch('apk.json');
      drinksDatabase = await response.json();
    } catch (e) {
      console.log('Could not load apk.json');
    }
  }

  // Get button color based on APK
  function getApkColor(apk) {
    if (!apk) return 'var(--accent)'; // blå om ingen APK
    if (apk < 1.5) return '#d32f2f'; // röd
    if (apk < 1.8) return '#f59e0b'; // orange/gul
    return '#388e3c'; // grön
  }

  // Search for drinks
  function searchDrinks(query) {
    const suggestionsContainer = document.getElementById('drinkSuggestions');

    if (!query || query.length < 1) {
      suggestionsContainer.style.display = 'none';
      return;
    }

    const results = drinksDatabase.filter(drink =>
      drink.namn.toLowerCase().includes(query.toLowerCase())
    ).slice(0, 10);

    if (results.length === 0) {
      suggestionsContainer.style.display = 'none';
      return;
    }

    suggestionsContainer.innerHTML = '';
    results.forEach(drink => {
      const item = document.createElement('div');
      item.className = 'drink-suggestion';
      const apkColor = getApkColor(drink.apk);
      item.style.borderLeftColor = apkColor;
      item.style.borderLeftWidth = '4px';
      item.style.borderLeftStyle = 'solid';
      item.innerHTML = `
        <div class="suggestion-name">${drink.namn}</div>
        <div class="suggestion-details">${drink.procent}% alkohol</div>
      `;
      item.addEventListener('click', () => {
        selectDrink(drink);
      });
      suggestionsContainer.appendChild(item);
    });

    suggestionsContainer.style.display = 'block';
  }

  // Select a drink from suggestions
  function selectDrink(drink) {
    // Bestäm volym baserat på typ
    let volym = 250; // default
    if (drink.typ === 'Sprit') {
      volym = 40;
    } else if (drink.typ === 'Vin') {
      volym = 150;
    } else if (drink.typ === 'Öl' || drink.typ === 'Cider') {
      volym = drink.volym || 330;
    }

    document.getElementById('volume').value = volym;
    document.getElementById('alcoholContent').value = drink.procent;
    document.getElementById('drinkSearch').value = drink.namn;
    document.getElementById('drinkSuggestions').style.display = 'none';

    // Ändra knappens färg baserat på APK
    const addButton = document.querySelector('button.btn-primary');
    const apkColor = getApkColor(drink.apk);
    addButton.style.backgroundColor = apkColor;
  }

  // Load settings from localStorage
  function loadSettings() {
    try {
      const weight = localStorage.getItem('weight') || '70';
      const gender = localStorage.getItem('gender') || 'male';
      const hunger = localStorage.getItem('hunger') || 'full';
      document.getElementById('weight').value = weight;
      document.getElementById('gender').value = gender;
      document.getElementById('hunger').value = hunger;
    } catch (e) {
      console.log('Could not load settings from localStorage');
    }
  }

  // Save settings to localStorage
  function saveSettings() {
    try {
      localStorage.setItem('weight', document.getElementById('weight').value);
      localStorage.setItem('gender', document.getElementById('gender').value);
      localStorage.setItem('hunger', document.getElementById('hunger').value);
    } catch (e) {
      console.log('Could not save settings to localStorage');
    }
  }

  // Add a drink
  function addDrink() {
    const volume = parseFloat(document.getElementById('volume').value);
    const alcoholContent = parseFloat(document.getElementById('alcoholContent').value);
    const drinkTime = document.getElementById('drinkTime').value;
    const drinkName = document.getElementById('drinkSearch').value;

    if (!volume || !alcoholContent || !drinkTime) {
      alert('Vänligen fyll i alla fält');
      return;
    }

    const drinks = getDrinks();
    const now = new Date();
    const [hours, minutes] = drinkTime.split(':');
    const drinkDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(hours), parseInt(minutes));

    drinks.push({
      id: Date.now(),
      namn: drinkName,
      volume,
      alcoholContent,
      time: drinkDate.toISOString(),
    });

    saveDrinks(drinks);
    loadDrinks();
    updateChart();
    updateApkAverage();

    // Clear inputs
    document.getElementById('volume').value = '';
    document.getElementById('alcoholContent').value = '';
    document.getElementById('drinkSearch').value = '';
    setDefaultDrinkTime();
  }

  // Get drinks from localStorage
  function getDrinks() {
    try {
      return JSON.parse(localStorage.getItem('drinks') || '[]');
    } catch {
      return [];
    }
  }

  // Save drinks to localStorage
  function saveDrinks(drinks) {
    try {
      localStorage.setItem('drinks', JSON.stringify(drinks));
    } catch (e) {
      console.log('Could not save drinks to localStorage');
    }
  }

  // Load and display drinks
  function loadDrinks() {
    const drinks = getDrinks();
    const container = document.getElementById('drinksList');
    container.innerHTML = '';

    if (drinks.length === 0) {
      container.innerHTML = '<p class="text-muted">Inga drinkar registrerade än</p>';
      return;
    }

    drinks.forEach(drink => {
      const drinkDate = new Date(drink.time);
      const timeString = drinkDate.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });

      // Beräkna ml ren alkohol
      const mlAlcohol = (drink.volume * drink.alcoholContent) / 100;
      // Omvandla till gram (alkoholens densitet ≈ 0,789 g/ml)
      const gramsAlcohol = mlAlcohol * 0.789;

      const item = document.createElement('div');
      item.className = 'drink-item';
      item.innerHTML = `
        <div class="drink-info">
          <div class="drink-time">${timeString}</div>
          <div class="drink-details">${drink.volume}ml @ ${drink.alcoholContent}% = ${gramsAlcohol.toFixed(1)}g alkohol</div>
        </div>
        <div class="drink-actions">
          <button class="btn-danger" onclick="removeDrink(${drink.id})">Ta bort</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  // Remove a drink
  function removeDrink(id) {
    const drinks = getDrinks();
    const filtered = drinks.filter(d => d.id !== id);
    saveDrinks(filtered);
    loadDrinks();
    updateChart();
    updateApkAverage();
  }

  // Clear all drinks
  function clearDrinks() {
    if (confirm('Är du säker på att du vill rensa all historik?')) {
      saveDrinks([]);
      loadDrinks();
      updateChart();
      updateApkAverage();
    }
  }

  // Beräkna och uppdatera APK-snittet
  function updateApkAverage() {
    const drinks = getDrinks();
    let apkValues = [];

    // Samla alla APK-värden från dryckerna i databasen
    drinks.forEach(drink => {
      const drinkData = drinksDatabase.find(d => d.namn === drink.namn);
      if (drinkData && drinkData.apk) {
        apkValues.push(drinkData.apk);
      }
    });

    console.log('Drinks:', drinks.length, 'APK Values found:', apkValues);

    // Beräkna snittet
    let average = '-';
    let apkColor = 'var(--accent)';

    if (apkValues.length > 0) {
      average = (apkValues.reduce((a, b) => a + b, 0) / apkValues.length).toFixed(2);
      const avgNum = parseFloat(average);

      // Bestäm färg baserat på snittet
      if (avgNum < 1.5) {
        apkColor = '#d32f2f'; // röd
      } else if (avgNum < 1.8) {
        apkColor = '#f59e0b'; // orange/gul
      } else {
        apkColor = '#388e3c'; // grön
      }
    }

    // Uppdatera visningen
    const apkValueElement = document.getElementById('apkValue');
    if (apkValueElement) {
      apkValueElement.textContent = average;
      apkValueElement.style.color = apkColor;
    }
  }

  // Calculate BAC (promille) with two-compartment model
  function calculatePromille() {
    const weight = parseFloat(document.getElementById('weight').value) || 70;
    const gender = document.getElementById('gender').value;
    const hunger = document.getElementById('hunger').value;
    const r = REDUCTION_FACTOR[gender];
    const k_a = K_VALUES[hunger]; // Absorptionshastighet från hungringsnivå
    const k_e = 0.15; // Elimineringshastighet (fast)

    const drinks = getDrinks();
    const now = new Date();

    // Generate data points for next 8 hours
    const dataPoints = [];
    const timePoints = [];

    for (let hour = 0; hour <= 8; hour += 0.25) {
      const timePoint = new Date(now.getTime() + hour * 60 * 60 * 1000);
      let totalPromille = 0;

      drinks.forEach(drink => {
        const drinkTime = new Date(drink.time);
        const hoursSinceDrink = (timePoint - drinkTime) / (1000 * 60 * 60);

        // Endast beräkna om drycken redan har druckits
        if (hoursSinceDrink >= 0) {
          const gramsAlcohol = (drink.volume * drink.alcoholContent) / 100;

          // Two-compartment model: C_i(t) = (A_i / (m * r)) * (exp(-k_e * t) - exp(-k_a * t))
          const A = gramsAlcohol;
          const term1 = Math.exp(-k_e * hoursSinceDrink);
          const term2 = Math.exp(-k_a * hoursSinceDrink);
          const promilleNow = (A / (weight * r)) * (term1 - term2);

          totalPromille += Math.max(0, promilleNow);
        }
      });

      dataPoints.push(totalPromille);
      timePoints.push(timePoint.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }));
    }

    return { dataPoints, timePoints };
  }

  // Update chart
  function updateChart() {
    const { dataPoints, timePoints } = calculatePromille();
    const container = document.getElementById('chartContainer');

    if (!container) return;

    // Create canvas
    container.innerHTML = '';
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);

    // Set canvas size based on container
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 350 * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = '350px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const padding = 60;
    const width = rect.width - padding * 2;
    const height = 350 - padding * 2;

    // Get colors from CSS variables
    const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const fgColor = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const mutedColor = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();

    // Find max promille for scaling
    const maxPromille = Math.max(...dataPoints, 2);
    const scale = height / maxPromille;

    // Clear canvas
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, rect.width, 350);

    // Draw background zones
    // Red zone: 0 - 0.6 ‰
    const redZoneLimit = 0.6;
    const redZoneHeight = (redZoneLimit / maxPromille) * height;
    ctx.fillStyle = 'rgba(211, 47, 47, 0.1)'; // Light red
    ctx.fillRect(padding, padding + height - redZoneHeight, width, redZoneHeight);

    // Green zone: 0.6+ ‰
    ctx.fillStyle = 'rgba(56, 142, 60, 0.1)'; // Light green
    ctx.fillRect(padding, padding, width, height - redZoneHeight);

    // Draw zone boundary line
    const boundaryY = padding + height - redZoneHeight;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(padding, boundaryY);
    ctx.lineTo(padding + width, boundaryY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw grid lines
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padding + height - (i * height / 5);
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(padding + width, y);
      ctx.stroke();
    }

    // Draw Y-axis labels
    ctx.fillStyle = mutedColor;
    ctx.font = '12px system-ui';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 5; i++) {
      const y = padding + height - (i * height / 5);
      const value = (i * maxPromille / 5).toFixed(1);
      ctx.fillText(value, padding - 10, y);
    }

    // Draw line chart
    if (dataPoints.length > 0) {
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();

      dataPoints.forEach((point, i) => {
        const x = padding + (i / (dataPoints.length - 1)) * width;
        const y = padding + height - point * scale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Draw points
      ctx.fillStyle = accentColor;
      dataPoints.forEach((point, i) => {
        const x = padding + (i / (dataPoints.length - 1)) * width;
        const y = padding + height - point * scale;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Draw X-axis labels
    ctx.fillStyle = mutedColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let hour = 0; hour <= 8; hour++) {
      const index = Math.round(hour * 4); // 0.25 hour intervals
      if (index < timePoints.length) {
        const x = padding + (index / (dataPoints.length - 1)) * width;
        ctx.fillText(timePoints[index], x, padding + height + 10);
      }
    }

    // Draw axis labels
    ctx.fillStyle = fgColor;
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Tid', rect.width / 2, 350 - 10);

    ctx.save();
    ctx.translate(15, 175);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Promille (‰)', 0, 0);
    ctx.restore();
  }

  // Drycktyper med format och alkoholhalt
  const drinkFormats = {
    ol: [
      { size: '330ml', volume: 330, percent: 5 },
      { size: '400ml', volume: 400, percent: 5 },
      { size: '500ml', volume: 500, percent: 5 }
    ],
    cider: [
      { size: '330ml', volume: 330, percent: 4.5 },
      { size: '400ml', volume: 400, percent: 4.5 },
      { size: '500ml', volume: 500, percent: 4.5 }
    ],
    vin: [
      { size: '150ml (12%)', volume: 150, percent: 12 },
      { size: '200ml (12%)', volume: 200, percent: 12 },
      { size: '150ml (14%)', volume: 150, percent: 14 },
      { size: '200ml (14%)', volume: 200, percent: 14 }
    ],
    sprit: [
      { size: '40ml (40%)', volume: 40, percent: 40 },
      { size: '60ml (40%)', volume: 60, percent: 40 }
    ]
  };

  // Uppdatera dryckformat baserat på vald typ
  function updateDrinkOptions() {
    const drinkType = document.getElementById('planDrinkType').value;
    const sizeSelect = document.getElementById('planDrinkSize');
    sizeSelect.innerHTML = '';

    drinkFormats[drinkType].forEach((format, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = format.size;
      sizeSelect.appendChild(option);
    });
  }

  // Beräkna promilleplanen
  function calculatePlan() {
    const startTime = document.getElementById('planStartTime').value;
    const targetTime = document.getElementById('planTargetTime').value;
    const endTime = document.getElementById('planEndTime').value;
    const targetPromille = parseFloat(document.getElementById('planTargetPromille').value);
    const drinkType = document.getElementById('planDrinkType').value;
    const sizeIndex = parseInt(document.getElementById('planDrinkSize').value);

    // Validering
    if (!startTime || !targetTime || !endTime || !targetPromille) {
      alert('Fyll i alla fält');
      return;
    }

    // Hämta drink-info
    const drink = drinkFormats[drinkType][sizeIndex];

    // Hämta personliga inställningar
    const weight = parseFloat(document.getElementById('weight').value) || 70;
    const gender = document.getElementById('gender').value;
    const hunger = document.getElementById('hunger').value;
    const r = REDUCTION_FACTOR[gender];
    const k = K_VALUES[hunger];

    // Helper: konvertera tid till minuter
    const timeToMinutes = (timeStr) => {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    };

    // Helper: konvertera minuter till tid-string (24h)
    const minutesToTime = (minutes) => {
      const h = Math.floor((minutes % (24 * 60)) / 60);
      const m = Math.floor(minutes % 60);
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    };

    // Konvertera alla tider
    let startMin = timeToMinutes(startTime);
    let targetMin = timeToMinutes(targetTime);
    let endMin = timeToMinutes(endTime);

    // Beräkna intervaller (hantera över midnatt)
    let buildupMinutes = targetMin >= startMin ?
      targetMin - startMin :
      (24 * 60 - startMin) + targetMin;

    let maintenanceMinutes = endMin >= targetMin ?
      endMin - targetMin :
      (24 * 60 - targetMin) + endMin;

    const buildupHours = buildupMinutes / 60;
    const maintenanceHours = maintenanceMinutes / 60;

    // Validering
    if (buildupHours <= 0) {
      alert('Målpromille-tid måste vara senare än starttid');
      return;
    }

    // Gram alkohol per drink
    const gramsPerDrink = (drink.volume * drink.percent) / 100 * 0.789;

    // Beräkna drycker för uppbyggning - sikta på 0.1‰ ÖVER målpromillen
    const bufferPromille = 0.1;
    const buildupTargetPromille = targetPromille + bufferPromille;
    const theoreticalGrams = buildupTargetPromille * weight * r;
    const drinksNeeded = Math.max(1, Math.round(theoreticalGrams / gramsPerDrink));

    // Maxhastighet: 1 enhet per 5 minuter
    const maxDrinksInTime = Math.floor(buildupMinutes / 5);
    if (drinksNeeded > maxDrinksInTime) {
      // Använd two-compartment-modell för att beräkna max möjlig promille
      const k_a = k; // Absorptionshastighet från hungringsnivå
      const k_e = 0.15; // Elimineringshastighet (fast)

      // Beräkna promille med maxhastighet (en dryck var 5:e minut)
      let maxPromille = 0;
      for (let i = 0; i < maxDrinksInTime; i++) {
        const timeOfDrink = (i * 5) / 60; // Timmar
        // Vid slutet av uppbyggningsfasen
        const t = buildupHours;
        const timeSinceDrink = t - timeOfDrink;
        if (timeSinceDrink >= 0) {
          const term1 = Math.exp(-k_e * timeSinceDrink);
          const term2 = Math.exp(-k_a * timeSinceDrink);
          maxPromille += (gramsPerDrink / (weight * r)) * (term1 - term2);
        }
      }

      alert(`Omöjligt att nå ${buildupTargetPromille}‰ på ${buildupHours.toFixed(1)} timmar.\n\nDu kan max dricka 1 enhet var 5:e minut = ${maxDrinksInTime} drycker.\nDet ger max ~${Math.max(0, maxPromille).toFixed(2)}‰ med ${drink.size}.\n\nFörsök med:\n- Längre tid till målpromille\n- Större/starkare drycker\n- Lägre målpromille`);
      return;
    }

    // Skapa schema
    let schedule = [];
    const k_a = k; // Absorptionshastighet
    const k_e = 0.15; // Elimineringshastighet

    // Helper: beräkna promille för en drink vid en viss tid
    const calculatePromilleAtTime = (drinkMinutes, currentMinutes, gramsPerDrink) => {
      const timeSinceMinutes = currentMinutes - drinkMinutes;
      if (timeSinceMinutes < 0) return 0;

      const timeSinceHours = timeSinceMinutes / 60;
      const term1 = Math.exp(-k_e * timeSinceHours);
      const term2 = Math.exp(-k_a * timeSinceHours);
      return (gramsPerDrink / (weight * r)) * (term1 - term2);
    };

    // ===== UPPBYGGNINGSFAS =====
    // Jämn fördelning för att nå målpromillen vid targetMin
    const buildupInterval = buildupMinutes / drinksNeeded;
    for (let i = 0; i < drinksNeeded; i++) {
      const drinkTime = startMin + (i * buildupInterval);
      schedule.push(minutesToTime(drinkTime));
    }

    // ===== UNDERHÅLLSFAS - DYNAMISK BERÄKNING =====
    // Målfasen: aldrig under målpromillen, dryck när promillen sjunker mot målnivån
    // Minst 5 minuter mellan drycker för att undvika spiker
    // Buffert: drick när promillen sjunker till 95% av målnivån
    const minDrinkInterval = 5; // minuter
    const promilleBuffer = targetPromille * 0.05; // 5% buffert (drick vid 95% av målnivån)

    if (maintenanceHours > 0) {
      let currentTime = targetMin + 1; // Börja söka 1 minut efter målnivå-tiden
      let maxIterations = 1000; // Säkerhet mot oändliga loopar
      let lastDrinkTime = timeToMinutes(schedule[schedule.length - 1]);

      while (currentTime < endMin && maxIterations > 0) {
        maxIterations--;

        // Beräkna nuvarande promille från alla tidigare drycker vid denna tid
        let currentPromille = 0;
        schedule.forEach(drinkTimeStr => {
          const drinkMin = timeToMinutes(drinkTimeStr);
          currentPromille += calculatePromilleAtTime(drinkMin, currentTime, gramsPerDrink);
        });

        // Om vi är under målnivån - buffert, drick nu (men minst minDrinkInterval från senaste drycken)
        if (currentPromille < targetPromille - promilleBuffer && currentTime >= lastDrinkTime + minDrinkInterval) {
          schedule.push(minutesToTime(currentTime));
          lastDrinkTime = currentTime;
          currentTime += 1; // Söka igen nästa minut
          continue;
        }

        currentTime += 1; // Stega fram en minut i taget
      }
    }

    // Formatera resultat
    const maintenanceDrinks = schedule.length - drinksNeeded;
    const buildupText = `Uppbyggningsfas: Drick ${drinksNeeded} x ${drink.size} från ${startTime} till ${targetTime} (${buildupHours.toFixed(1)} timmar) för att nå ~${(targetPromille + bufferPromille).toFixed(1)}‰`;

    let maintenanceText = '';
    if (maintenanceHours > 0) {
      if (maintenanceDrinks > 0) {
        maintenanceText = `Underhållsfas: Drick ${maintenanceDrinks} x ${drink.size} från ${targetTime} till ${endTime} för att hålla promillen över ${targetPromille}‰`;
      } else {
        maintenanceText = `Underhållsfas: Ingen ytterligare dryck behövs - promillen håller sig över ${targetPromille}‰ naturligt`;
      }
    } else {
      maintenanceText = 'Ingen underhållsfas (sluttid = målpromille-tid)';
    }

    // Visa resultat
    document.getElementById('planBuildupText').textContent = buildupText;
    document.getElementById('planMaintenanceText').textContent = maintenanceText;
    document.getElementById('planSchedule').textContent = 'Dryck på tiderna:\n' + schedule.join(', ');
    document.getElementById('planResult').style.display = 'block';

    // Rita promillekurva för planen
    drawPlanChart(startMin, targetMin, endMin, schedule, weight, r, k, gramsPerDrink, drinkType);
  }

  // Rita promillekurva för Promilleplaneraren (8 timmar från starttiden, EXAKT som huvudgrafen)
  function drawPlanChart(startMin, targetMin, endMin, schedule, weight, r, k_a, gramsPerDrink, drinkType) {
    const k_e = 0.15;

    // Skapa container för graf
    let chartContainer = document.getElementById('planChartContainer');
    if (!chartContainer) {
      chartContainer = document.createElement('div');
      chartContainer.id = 'planChartContainer';
      chartContainer.style.width = '100%';
      chartContainer.style.height = '350px';
      chartContainer.style.marginTop = '1.5rem';
      document.getElementById('planResult').appendChild(chartContainer);
    }

    chartContainer.innerHTML = '';
    const canvas = document.createElement('canvas');
    chartContainer.appendChild(canvas);

    const dpr = window.devicePixelRatio || 1;
    const rect = chartContainer.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 350 * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = '350px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const padding = 60;
    const width = rect.width - padding * 2;
    const height = 350 - padding * 2;

    // Få CSS-färger
    const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const fgColor = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const mutedColor = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();

    // Beräkna promille över 8 timmar från starttiden (EXAKT som huvudgrafen)
    const dataPoints = [];
    const timePoints = [];

    // Använd samma 0.25-timmars intervall som huvudgrafen (33 datapunkter totalt)
    for (let hour = 0; hour <= 8; hour += 0.25) {
      const hourMinutes = hour * 60; // Minuter från starttiden
      let totalPromille = 0;

      // För varje dryck i schemat
      schedule.forEach((drinkTime) => {
        const [h, m] = drinkTime.split(':').map(Number);
        const drinkMinutes = h * 60 + m;
        // Tid sedan denna dryck i timmar
        const timeSinceMinutes = hourMinutes - (drinkMinutes - startMin);

        if (timeSinceMinutes >= 0) {
          const timeSinceHours = timeSinceMinutes / 60;
          const term1 = Math.exp(-k_e * timeSinceHours);
          const term2 = Math.exp(-k_a * timeSinceHours);
          totalPromille += (gramsPerDrink / (weight * r)) * (term1 - term2);
        }
      });

      dataPoints.push(Math.max(0, totalPromille));

      // Lagra tidpunkter baserat på starttiden
      const totalMinutes = startMin + hourMinutes;
      const timeHours = Math.floor((totalMinutes / 60) % 24);
      const timeMins = Math.floor(totalMinutes % 60);
      timePoints.push(String(timeHours).padStart(2, '0') + ':' + String(timeMins).padStart(2, '0'));
    }

    const maxPromille = Math.max(...dataPoints, 2);
    const scale = height / maxPromille;

    // Rita bakgrund
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, rect.width, 350);

    // Rita röd zon (0-0.6‰)
    const redZoneLimit = 0.6;
    const redZoneHeight = (redZoneLimit / maxPromille) * height;
    ctx.fillStyle = 'rgba(211, 47, 47, 0.1)';
    ctx.fillRect(padding, padding + height - redZoneHeight, width, redZoneHeight);

    // Rita grön zon (0.6+‰)
    ctx.fillStyle = 'rgba(56, 142, 60, 0.1)';
    ctx.fillRect(padding, padding, width, height - redZoneHeight);

    // Rita gräns mellan zoner (streckad linje vid 0.6‰)
    const boundaryY = padding + height - redZoneHeight;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(padding, boundaryY);
    ctx.lineTo(padding + width, boundaryY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Rita rutnät
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padding + height - (i * height / 5);
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(padding + width, y);
      ctx.stroke();
    }

    // Rita Y-axis labels
    ctx.fillStyle = mutedColor;
    ctx.font = '12px system-ui';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 5; i++) {
      const y = padding + height - (i * height / 5);
      const value = (i * maxPromille / 5).toFixed(1);
      ctx.fillText(value, padding - 10, y);
    }

    // Rita slät kurva utan datapunkter
    if (dataPoints.length > 0) {
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();

      dataPoints.forEach((point, i) => {
        const x = padding + (i / (dataPoints.length - 1)) * width;
        const y = padding + height - point * scale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Rita större punkter på drycktiderna med etiketter
      ctx.fillStyle = accentColor;

      // Drycktyp-mapping
      const drinkTypeNames = {
        'ol': 'ÖL',
        'cider': 'CIDER',
        'vin': 'VIN',
        'sprit': 'SPRIT'
      };
      const drinkLabel = drinkTypeNames[drinkType] || drinkType.toUpperCase();

      schedule.forEach((drinkTime) => {
        const [h, m] = drinkTime.split(':').map(Number);
        const drinkMinutes = h * 60 + m;
        const timeSinceMinutes = drinkMinutes - startMin;

        // Hitta motsvarande index i dataPoints (0.25-timmars intervaller)
        const hoursSinceDrink = timeSinceMinutes / 60;
        const index = Math.round(hoursSinceDrink * 4); // 0.25 hour intervals

        if (index >= 0 && index < dataPoints.length) {
          const x = padding + (index / (dataPoints.length - 1)) * width;
          const y = padding + height - dataPoints[index] * scale;
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2); // Större punkter (5px istället för 3px)
          ctx.fill();

          // Rita etikett ovanför punkten med drycktyp och utropstecken
          const labelText = drinkLabel + '!';
          ctx.fillStyle = mutedColor;
          ctx.font = 'bold 11px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(labelText, x, y - 12);

          // Rensa för nästa punkt
          ctx.fillStyle = accentColor;
        }
      });
    }

    // Rita X-axis labels (timmar, samma som huvudgrafen)
    ctx.fillStyle = mutedColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let hour = 0; hour <= 8; hour++) {
      const index = Math.round(hour * 4); // 0.25 hour intervals
      if (index < timePoints.length) {
        const x = padding + (index / (dataPoints.length - 1)) * width;
        ctx.fillText(timePoints[index], x, padding + height + 10);
      }
    }

    // Rita axis labels
    ctx.fillStyle = fgColor;
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Tid', rect.width / 2, 350 - 10);

    ctx.save();
    ctx.translate(15, 175);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Promille (‰)', 0, 0);
    ctx.restore();
  }

  // Initialisera dryckformat när sidan laddar
  document.addEventListener('DOMContentLoaded', () => {
    updateDrinkOptions();
  });</script>
